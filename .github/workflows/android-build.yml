name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Verify Racing Brothers APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1 & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || \
            sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare build prerequisites (debug keystore & .env.example)
        run: |
          if [ ! -f .env.example ]; then
            echo "# Racing Brothers environment variables (optional)" > .env.example
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Android unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK (with libGDX natives)
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK integrity, signature, manifest & libGDX natives
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"

          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_PATH" | head -n 25

          unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml"
          unzip -l "$APK_PATH" | grep -q "classes.*\.dex"
          unzip -l "$APK_PATH" | grep -q "lib/arm64-v8a/libgdx.so"
          unzip -l "$APK_PATH" | grep -q "lib/armeabi-v7a/libgdx.so"
          echo "APK verification passed successfully."

      - name: Upload Racing Brothers Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Racing-Brothers-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
