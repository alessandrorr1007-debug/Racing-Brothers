name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: v0.1.0-test
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk
  RELEASE_APK: Racing-Brothers-v0.1.0-test.apk

jobs:
  build-apk:
    name: Build & Verify Racing Brothers APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK (platform 36.1 + build-tools)
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}"
          echo "sdkmanager=$(command -v sdkmanager)"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare build prerequisites (debug keystore & .env.example)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .env.example ]; then
            echo "# Racing Brothers environment variables (optional)" > .env.example
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore

      - name: Run Android unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK (with libGDX natives)
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK integrity, signature, manifest & libGDX natives
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"

          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_PATH" | head -n 25

          unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml"
          unzip -l "$APK_PATH" | grep -q "classes.*\.dex"
          unzip -l "$APK_PATH" | grep -q "lib/arm64-v8a/libgdx.so"
          unzip -l "$APK_PATH" | grep -q "lib/armeabi-v7a/libgdx.so"
          echo "APK verification passed successfully."

      - name: Upload Racing Brothers Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Racing-Brothers-Android-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error

      - name: Prepare release asset
        shell: bash
        run: cp "$APK_PATH" "$RELEASE_APK"

      - name: Publish test release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Racing Brothers — prueba ${{ env.RELEASE_TAG }}
          body: |
            APK de depuración generado automáticamente desde `main`.

            - Paquete: `com.aistudio.racingbrothers.kxmpzq`
            - Descarga directa: `${{ env.RELEASE_APK }}`
            - Compilación: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_APK }}
